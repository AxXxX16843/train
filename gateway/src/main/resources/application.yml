server:
  port: 8000
spring:
  application:
    name: gatewayService
  cloud:
    nacos:
      discovery:
        server-addr: localhost:8848
    gateway:
      routes:
        - id: member
          uri: lb://memberService
          predicates:
            - Path=/member/**
        - id: member
          uri: lb://businessService
          #          uri: ib://business
          predicates:
            - Path=/business/**
        - id: batch
          uri: lb://batchService
          predicates:
            - Path=/batch/**
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOriginPatterns: "*"
            allowedHeaders: "*"
            allowedMethods: "*"
            allowCredentials: true
            maxAge: 3600